# Render 배포 설정 (무료 티어)
#
# Render는 Blueprint 파일을 **저장소 루트**에서 찾는다. backend/ 안에 두었더니
# "render.yaml not found on main branch"로 거부했다.
#
# Railway 대신 무료로 운영하기 위한 구성이다. 대가는 cold start다 — 15분간
# 요청이 없으면 인스턴스가 잠들고, 다시 깨우는 데 30~60초가 걸린다.
# 프론트엔드가 그 사실을 배너로 알린다(BackendWakingBanner).
#
# 분석은 202 응답 후 백그라운드에서 수십 초 돈다. Render 웹 서비스는 응답을
# 보낸 뒤에도 프로세스가 살아 있으므로 그 작업이 잘리지 않는다. 서버리스를
# 쓰지 않는 이유가 이것이다 (01 기획서 §12).

services:
  - type: web
    name: reg-radar-api
    runtime: docker
    # rootDir이 빌드 컨텍스트이자 Dockerfile을 찾는 기준이다.
    # dockerfilePath는 기준이 루트인지 rootDir인지 문서마다 읽히는 바가 달라
    # 아예 생략한다. 생략하면 rootDir의 Dockerfile을 쓴다.
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health

    # preDeployCommand는 넣지 않는다 — 무료 티어가 거부한다.
    #   "pre-deploy command is not supported for free tier services"
    #
    # 그래서 마이그레이션은 **수동**이다. 새 마이그레이션을 추가했을 때 한 번:
    #   DATABASE_URL="<운영 URL>" python scripts/migrate.py
    #
    # 자동으로 돌지 않는 것보다 **그 사실이 조용한 것**이 더 위험하다. 스키마가
    # 코드보다 뒤처진 채 서비스가 정상인 척 뜨고, 새 칼럼을 읽는 순간에야
    # UndefinedColumnError로 드러난다. 그래서 기동 로그에 경고를 남기고
    # /api/v1/health의 pending_migrations에 목록을 싣는다.

    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: STORAGE
        value: postgres
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LOG_LEVEL
        value: INFO

      # 무료 배포에서는 끈다. Chroma는 로컬 디렉터리에 저장하는데 컨테이너가
      # 다시 뜨면 사라지고, 영구 디스크는 유료다 (08 가이드 §5 선택 A).
      # 이미지에 chromadb도 넣지 않았으므로 켜도 동작하지 않는다.
      - key: RAG_ENABLED
        value: "false"

      # AI 호출 비용을 유한하게 묶는다. 가입이 열린 공개 배포에서 이것이 없으면
      # '동시 1건' 제약만으로는 하루에 몇 번이든 돌릴 수 있다.
      - key: DAILY_ANALYSIS_LIMIT_PER_USER
        value: "5"
      - key: DAILY_ANALYSIS_LIMIT_TOTAL
        value: "50"

      # 아래는 값을 여기 적지 않는다. Render 대시보드에서 직접 넣는다.
      # 저장소가 공개라 커밋되는 파일에 비밀값이 들어가면 그대로 노출된다.
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LAW_API_OC
        sync: false

      # 프론트엔드 도메인이 정해진 뒤에 넣는다. 순서가 어긋나면 화면은 뜨는데
      # API 호출이 전부 CORS로 막힌다.
      - key: CORS_ORIGINS
        sync: false
